kind: study
seed: 1
presentation:
  description: Batch-wide lipidomics study of A549 and MDM samples
preprocessing:
  blank_filter: {enabled: true, minimum_sample_to_blank_ratio: 5, minimum_blank_prevalence: 0.5}
  qc_rsd_filter: {enabled: true, threshold_percent: 30}
  missing_values: {method: half_minimum}
  normalization: {method: pqn}
  transformation: {method: log2}
  scaling: {method: pareto}
display_group: sample_type
analyses:
  pca: {enabled: true, components: 5, include_qc: false, include_blanks: false}
  pcoa: {enabled: true, stage: normalized, distance: bray, components: 5, include_qc: false, include_blanks: false}
